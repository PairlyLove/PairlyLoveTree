<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pairly</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;font-family:Segoe UI,sans-serif;overflow:hidden}

body{
  background:linear-gradient(135deg,#ffd6e8,#fff1f7);
}

/* LOADING */
#loading{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffd6e8,#fff1f7);
  z-index:999;
  transition:.8s;
}
#loading span{font-size:42px}
#loading p{margin-top:12px;color:#a83b6a}

/* START */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}
h1{color:#a83b6a;margin-bottom:16px}
button{
  padding:14px 28px;
  border:none;
  border-radius:999px;
  background:#ff5fa2;
  color:white;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}

/* HEARTS */
.heart{
  position:absolute;
  animation:float 4s linear forwards;
}
@keyframes float{
  from{transform:translateY(0);opacity:1}
  to{transform:translateY(-120vh);opacity:0}
}

/* GALLERY */
.gallery{
  position:absolute;
  inset:0;
  display:none;
}
.photo{
  position:absolute;
  width:180px;
  animation:fall 6s linear forwards;
  text-align:center;
}
.photo img{
  width:100%;
  border-radius:14px;
}
.date{margin-top:6px;font-size:14px;color:#555}

@keyframes fall{
  from{transform:translateY(-30vh)}
  to{transform:translateY(120vh)}
}

/* FINAL */
.final{
  position:absolute;
  inset:0;
  display:none;
  background-size:cover;
  background-position:center;
}
.final-message{
  position:absolute;
  bottom:15%;
  width:100%;
  text-align:center;
  font-size:28px;
  color:white;
  opacity:0;
  transition:1s;
}
</style>
</head>

<body>

<div id="loading">
  <span>💞</span>
  <p>Pairly hazırlanıyor...</p>
</div>

<audio id="bgMusic" src="music.mp3"></audio>

<div class="center" id="startScreen">
  <h1>Pairly 💞</h1>
  <button id="startBtn">Tıkla</button>
  <p id="subtitle"></p>
</div>

<div class="gallery" id="gallery"></div>

<div class="final" id="finalScreen">
  <div class="final-message" id="finalMessage"></div>
</div>

<script>
/* LOADING */
window.addEventListener("DOMContentLoaded",()=>{
  setTimeout(()=>{
    document.getElementById("loading").style.opacity=0;
    setTimeout(()=>document.getElementById("loading").remove(),800);
  },1200);
});

/* URL İSİMLER */
const params=new URLSearchParams(window.location.search);
const A=params.get("a")||"Emre";
const B=params.get("b")||"Yasuo";
document.getElementById("subtitle").innerText=`${A} ve ${B}'nin sevgi dolu anları`;
document.title=`${A} ❤️ ${B} | Pairly`;

/* FOTOĞRAFLAR */
const photos=[
  {src:"foto1.jpg",date:"14.02.2024"},
  {src:"foto2.jpg",date:"01.06.2024"},
  {src:"foto3.jpg",date:"10.09.2024"}
];

const finalPhoto="foto4.jpg";
const finalText=`${A} ❤️ ${B}`;

/* BAŞLAT */
document.getElementById("startBtn").onclick=()=>{
  const music=document.getElementById("bgMusic");
  music.volume=1;
  music.play().catch(()=>{});
  document.getElementById("startScreen").style.display="none";
  hearts();
  setTimeout(showGallery,1200);
};

function hearts(){
  for(let i=0;i<20;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.innerText="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.bottom="-20px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),4000);
  }
}

function showGallery(){
  const g=document.getElementById("gallery");
  g.style.display="block";
  let i=0;
  const w=setInterval(()=>{
    const p=photos[i%photos.length];
    const d=document.createElement("div");
    d.className="photo";
    d.style.left=Math.random()*80+"vw";
    d.innerHTML=`<img src="${p.src}"><div class="date">${p.date}</div>`;
    g.appendChild(d);
    setTimeout(()=>d.remove(),8000);
    i++;
    if(i>15)clearInterval(w);
  },500);
  setTimeout(showFinal,8000);
}

function showFinal(){
  const f=document.getElementById("finalScreen");
  f.style.display="block";
  f.style.backgroundImage=`url(${finalPhoto})`;
  setTimeout(()=>{
    const m=document.getElementById("finalMessage");
    m.innerText=finalText;
    m.style.opacity=1;
  },1500);
}
</script>

</body>
</html>
